name: CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Validar importacao da API
        run: |
          python -c "from app.main import app; print('API carregada com sucesso')"

      - name: Executar testes unitarios
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

  CD:
    needs: CI
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: |
          docker build -t gestao-usuarios .

  ALERTA_DISCORD:
    needs:
      - CI
      - CD
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Enviar alerta para Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\":\"✅ **GitHub Actions concluído com sucesso!**\n\n📦 Repositório: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n👤 Autor: ${{ github.actor }}\n🔄 CI: aprovado\n🐳 CD: aprovado\n\n🔗 Execução: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          "$DISCORD_WEBHOOK"
